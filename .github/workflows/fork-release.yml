# Fork release: builds the CLI (kimi) native bundles for all platforms plus
# the hub (kimi-hub) SEA executables, then publishes them as GitHub Release
# assets on this fork. The upstream release workflow is owner-gated to
# MoonshotAI, so the fork keeps its own pipeline.
#
# Trigger:
#   - manual: Actions → "Fork Release" → pick a tag, or
#   - push a tag matching `fork-v*` (that tag becomes the release).
name: Fork Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. fork-v0.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'fork-v*'

permissions:
  contents: write

concurrency: fork-release-${{ github.ref_name }}

jobs:
  cli:
    name: CLI native bundle
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-native
      retention-days: 3
      sign-macos: false

  hub:
    name: Hub SEA (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + smoke the hub SEA executable
        run: pnpm --filter @moonshot-ai/kimi-hub-server run build:native:smoke

      - name: Package hub artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="apps/kimi-hub/server/dist-native/artifacts"
          mkdir -p "$artifact_dir"
          (cd "apps/kimi-hub/server/dist-native/bin/${{ matrix.target }}" && zip "../../artifacts/kimi-hub-${{ matrix.target }}.zip" "$(ls kimi-hub*)")
          (cd "$artifact_dir" && (command -v sha256sum >/dev/null && sha256sum "kimi-hub-${{ matrix.target }}.zip" || shasum -a 256 "kimi-hub-${{ matrix.target }}.zip") > "kimi-hub-${{ matrix.target }}.zip.sha256")

      - name: Upload hub artifact
        uses: actions/upload-artifact@v7
        with:
          name: kimi-hub-${{ matrix.target }}
          retention-days: 3
          path: |
            apps/kimi-hub/server/dist-native/artifacts/kimi-hub-${{ matrix.target }}.zip
            apps/kimi-hub/server/dist-native/artifacts/kimi-hub-${{ matrix.target }}.zip.sha256

  release:
    name: Publish release
    needs: [cli, hub]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-native-*
          path: dist
          merge-multiple: true

      - name: Download hub artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-hub-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          args=(--repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes "Fork build: kimi CLI native bundles + kimi-hub SEA executables.")
          if [ "$PRERELEASE" = "true" ] || [ "$PRERELEASE" = "1" ]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" "${args[@]}"
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 "${args[@]}"
          fi
