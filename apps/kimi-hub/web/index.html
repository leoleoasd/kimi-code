<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app reach under the iOS notch/home bar; the
         safe-area env() insets are then applied per-edge in CSS (index.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-64.png" />
    <!-- iOS "Add to Home Screen": apple-touch-icon + web-app metas are required;
         the manifest alone does not get picked up by Safari. -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kimi Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kimi Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
